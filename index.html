<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Políticos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: #1a365d;
            margin-bottom: 20px;
            text-align: center;
        }

        #input {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 30px;
        }

        #input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
        }

        .cartao-resultado {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 100%;
            max-width: 350px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #partido, #uf, #nome, #despesas {
            font-size: 18px;
            font-weight: bold;
            color: #475569;
            margin-top: 10px;
        }

        #foto {
            width: 150px;
            height: 200px;
            object-fit: cover; 
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: none; 
        }
    </style>
</head>
<body>
    <h1>API Test</h1>
    
    <input type="text" id="input" placeholder="Digite o nome do deputado e aperte Enter..." autocomplete="off">

    <div class="cartao-resultado">
        <img id="foto" alt=""> 
        <div id="nome"></div>
        <div id="partido">Faça uma busca para começar</div>
        <div id="uf"></div>
        <div id="despesas"></div>
    </div>

    <script src="api.js"></script>
</body>
</html>
